name: SunlightPlayerSettings
version: 1.5.0
main: net.sunlightsmp.playersettings.SunlightPlayerSettings
api-version: '1.21'
author: Sunlight SMP
description: Sunlight SMP player settings, TPA, Auction House, Discord, Store, RTP, voice chat, Coinflip, Orders and Teams
softdepend: [voicechat]
commands:
  settings:
    description: Open your personal Sunlight SMP settings
    usage: /settings
    aliases: [setting, options]
  ah:
    description: Open the Sunlight SMP Auction House
    usage: /ah
    aliases: [auction, auctionhouse]
  sunlightpickaxe:
    description: Get a temporary 3x3 Sunlight Pickaxe
    usage: /sunlightpickaxe
    aliases: [spickaxe]
  discord:
    description: Get the Sunlight SMP Discord link
    usage: /discord
  store:
    description: Get the Sunlight SMP Store link
    usage: /store
  sell:
    description: Open the Sunlight Sell menu
    usage: /sell
  worth:
    description: Open the Sunlight item worth menu
    usage: /worth
  shop:
    description: Open the Sunlight Shop
    usage: /shop
  rtp:
    description: Teleport to a random safe location
    usage: /rtp
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept your latest TPA request
    usage: /tpaccept
  tpdeny:
    description: Deny your latest TPA request
    usage: /tpdeny
  tpacancel:
    description: Cancel your outgoing TPA request
    usage: /tpacancel
  sunlightsellaxe:
    description: Give a Sunlight Sellaxe
    usage: /sunlightsellaxe
  sunlighttreechopper:
    description: Give a Sunlight Tree Chopper
    usage: /sunlighttreechopper
  sunlightshardbooster:
    description: Give a 4x Sunlight Shard Booster
    usage: /sunlightshardbooster
  sunlightbucket:
    description: Give a Sunlight Bucket
    usage: /sunlightbucket
  sunflower:
    description: Open your Sunflower wallet and claim
    usage: /sunflower [claim]
    aliases: [sunflowers]
  sunflowerspawner:
    description: Buy a Sunlight Spawner
    usage: /sunflowerspawner <skeleton|zombie|witch|iron_golem|spider|creeper>
  coinflip:
    description: Create or join a player vs player coinflip
    usage: /coinflip <amount>
    aliases: [cf, flip]
  sunkeyall:
    description: Give every online player crate keys with an animation
    usage: /sunkeyall <crate> <amount> | /sunkeyall reload
  suncrates:
    description: Open the Sunlight Crates menu
    usage: /suncrates
  home:
    description: Open homes or teleport to a home
    usage: /home [name]
    aliases: [homes]
  sethome:
    description: Create or update a home
    usage: /sethome <name>
  delhome:
    description: Delete a home
    usage: /delhome <name>
  homeinfo:
    description: Show home information
    usage: /homeinfo <name>
  renamehome:
    description: Rename a home
    usage: /renamehome <old> <new>
  suncrate:
    description: Open or manage a Sunlight crate
    usage: /suncrate <crate> | /suncrate give <crate> [amount] | /suncrate edit <crate> | /suncrate reload
  bounty:
    description: Player bounty system
    usage: /bounty [player amount|list|history|cancel player]
  bountyadmin:
    description: Admin bounty management
    usage: /bountyadmin <remove|add|clear|reload>
  order:
    description: Player-to-player item order system
    usage: /order [create|search|cancel|myorders|history]
  tags:
    description: Open the Sunlight SMP Tag Shop
    usage: /tags
permissions:
  bounty.use:
    default: true
  bounty.create:
    default: true
  bounty.cancel:
    default: true
  bounty.admin:
    default: op
  bounty.bypass:
    default: false
  team:
    description: Sunlight SMP player team system
    usage: /team [create|invite|accept|deny|kick|promote|demote|leave|chat|info|rename|tag|color]
  tc:
    description: Toggle team chat
    usage: /tc
    aliases: [teamchat]
permissions:
  sunlightsmp.settings:
    default: true
  sunlightsmp.tags:
    default: true
  sunlightsmp.tpa:
    default: true
  sunlightsmp.ah:
    default: true
  sunlightsmp.pickaxe:
    default: true
  sunlightsmp.rtp:
    default: true
  sunlightsmp.crates.admin:
    default: op
  sunlightsmp.keyall:
    default: op
  homes.use:
    default: true
  homes.limit.3:
    default: false
  homes.limit.5:
    default: false
  homes.limit.10:
    default: false
  homes.sethome:
    default: true
  homes.delete:
    default: true
  homes.teleport:
    default: true
  homes.admin:
    default: op
  homes.vip:
    default: false
  homes.premium:
    default: false
